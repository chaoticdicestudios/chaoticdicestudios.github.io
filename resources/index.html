<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Free tools for tabletop gamers.">
  <meta name="robots" content="index, follow">
  <title>Free Resources - Chaotic Dice Studios</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <script defer src="https://cloud.umami.is/script.js" data-website-id="42ec36c1-25f1-4bc5-8963-ef3c47a90265"></script>

<body>

  <nav>
    <a href="../products/">Products</a>
    <a href="../">Home</a>
  </nav>

  <main class="stage">
    <div class="logo-wrap">
      <img src="../images/logo.svg" alt="Chaotic Dice Studios">
    </div>
    <div class="rule">
      <div class="rule-gem"></div>
    </div>
    <p class="page-title">Free Resources</p>

    <!-- ── Tools grid ─────────────────────────────────────── -->
    <div class="tools-grid">

      <a class="tool-card" href="armada-shot-calc/">
        <div class="tool-card__icon" aria-hidden="true">
          <img src="./armada-shot-calc/icons/galleon.svg" alt="Galleon Icon" />
        </div>
        <div class="tool-card__body">
          <p class="tool-card__game">Mantic Armada</p>
          <h2 class="tool-card__title">Armada Shot Calc</h2>
          <p class="tool-card__desc">Step-by-step shooting modifier calculator. Determine the minimum die roll needed to
            hit enemy ships!</p>
          <span class="tool-card__badge">Free Web App</span>
        </div>
      </a>

    </div>
    <!-- /.tools-grid -->

  </main>
